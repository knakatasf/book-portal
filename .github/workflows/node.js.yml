name: Frontend & Nginx CI

on:
  push:
    branches: [ master, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

env:
  CI: false  # avoid react-scripts treating warnings as errors

jobs:
  build:
    name: Node Install & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 17.x ]  # matches project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './book-portal-fe/package-lock.json'

      - name: npm ci
        run: npm ci
        working-directory: ./book-portal-fe

      - name: Build FE
        run: npm run build --if-present
        working-directory: ./book-portal-fe

  docker:
    name: Build & Push FE + Proxy to ECR
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "254518245611"
      ECR_REGISTRY: "254518245611.dkr.ecr.us-east-1.amazonaws.com"
      FE_IMAGE: book-portal-fe
      PROXY_IMAGE: book-portal-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push FE (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./book-portal-fe
          file: ./book-portal-fe/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FE_IMAGE }}:latest

      - name: Build & Push Nginx Proxy (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROXY_IMAGE }}:latest
