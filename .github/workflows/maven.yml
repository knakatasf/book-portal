name: Backend CI (Maven + ECR)

permissions:
  contents: read
  security-events: write   # <-- required to upload CodeQL SARIF
  actions: read

on:
  push:
    branches: [ master, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  analyze_and_build:
    name: Analyze and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build (Maven, skip tests)
        run: mvn -B -DskipTests package --file pom.xml
        working-directory: ./book-portal-be

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker:
    name: Build & Push BE to ECR
    runs-on: ubuntu-latest
    needs: analyze_and_build
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "254518245611"
      ECR_REGISTRY: "254518245611.dkr.ecr.us-east-1.amazonaws.com"
      IMAGE_NAME: book-portal-be
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you use long-lived access keys in repo secrets:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./book-portal-be
          file: ./book-portal-be/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
